name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "old-main" branch
  push:
    branches: [ "old-main" ]
  pull_request:
    branches: [ "old-main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Formatting
      - name: Lint Notebooks with nbQA
        run: |
          pip install nbqa black
          nbqa black .
          
      # Converting to script.
      - name: Convert Notebook to Python Script
        run: |
          pip install jupyter
          jupyter nbconvert --to script Diabetes_Prediction.ipynb
      
      # Run script.
      - name: Run Converted Python Script
        run: python Diabetes_Prediction.py

      # Upload script.
      - name: Upload Converted Script Artifact
        uses: actions/upload-artifact@v3
        with:
          name: converted-script
          path: Diabetes_Prediction.py
